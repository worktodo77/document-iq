#

# The machine-readable half of the amendment register.
#
# `amendments.md` is the argument — why an amendment was needed, what it cost,
# what it uncovered. That prose is the part worth reading and it is not being
# replaced. But prose cannot be checked, and two amendments in one sprint proved
# that matters:
#
#   A-12 was raised by two tracks and applied by neither. Every agent behaved
#   correctly and the product shipped a permanently disabled button.
#
#   A-14 was raised, applied, wired, measured and shipped -- and then had no
#   entry in amendments.md for a day, while the Codex relay pointed reviewers at
#   that file to read it.
#
# So each entry states what it would mean for the amendment to be REALLY
# applied, in terms a script can verify: the symbols that must exist in the
# modules it claims to have changed, the commit that adopted it, and the tests
# that hold it. `tools/check_amendments.py` fails when any of those is a claim
# rather than a fact -- including when an amendment is referenced somewhere in
# the repo and has no entry here at all.
#
# `wired_in` is the load-bearing field. It is the difference between "the seam
# declares this" and "the product does this", which is precisely the distance
# nothing was measuring.

# ---------------------------------------------------------------------------
# Sprint 1 (A-01 .. A-10). Backfilled 2026-08-04, when the check above was
# written and immediately reported all ten as referenced-but-absent -- the same
# omission it was built to catch on A-14, ten times over and eighteen months of
# reading habit deep. `adopted_in` is the Sprint-1 merge commit: these were
# applied across many commits on `build/sprint-1`, and the merge is the point at
# which they became true of `main`. Recorded at that granularity rather than
# guessed at a finer one.
# ---------------------------------------------------------------------------

