# A-11b was invisible to `tools/check_amendments.py` for a reason worth writing
# down: its reference pattern is `\bA-(\d{2})\b`, and "A-11b" does not match it.
# So the one amendment in the register with a letter suffix was the one nothing
# checked -- and it is the one that turned out to be declared on the seam and
# populated by no adapter and rendered by no screen, for the length of the
# sprint. `adopted_in` is the commit that actually wired it, not the one that
# declared it.
[amendment.A-11b]
status = "applied"
title = "the checklist attributes a DROP by rule identity and never shows what it matches or who approved it"
raised_by = "Track E, which proposed both fields and declined to apply them"
adopted_in = "91fed8d"
# D-35 moved A-11b's two fields to a new source WITHOUT weakening the
# amendment, and the checker is what forced the entry to say so: `_section_rules`
# and `_rule_text` read a PROFILE's pattern and the expert's note, and both are
# deleted with the engine. `_template_lever` now populates the same two seam
# fields from the template family -- `rule` from its patterns, `note` from its
# rationale, which SectionFamily.validate() refuses to leave empty. So the
# guarantee is stronger than it was: the old source could be blank (a profile
# with no note), the new one cannot.
wired_in = { "src/dociq/adapter.py" = ["_template_lever"], "src/dociq/gui/view_models.py" = ["matched_by", "expert_note"], "src/dociq/gui/screens.py" = ["ProfileChecklistScreen"] }
tests = ["tests/test_seam_population.py", "tests/test_view_models.py"]

